spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.clean-disabled=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial baseline
logging.level.org.flywaydb.core=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# JPA & Hibernate (PostgreSQL + Flyway)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=test
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret=your-very-secret-key-of-32-or-more-characters
jwt.access-token-expiration=3600000
jwt.issuer=rushabh.com